packages:
  - packages/framework/*
  - packages/platform/*
  - packages/ecosystem/*
  - packages/cli/*
  - packages/deploy/*
  - apps/playground/**
  - apps/docs/**
  - apps/docs-v2/**
  - apps/examples/**
  - bench

overrides:
  '@vitejs/plugin-react': ^6.0.0
  react: ^19.1.1
  react-dom: ^19.1.1
  vitest: 4.1.12
  '@vitest/coverage-v8': 4.1.12
